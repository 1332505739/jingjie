  <div class="background-canvas">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-logo">
        <span class="logo-icon">☽</span>
        <span class="gold-text">静界</span>
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换亮色/暗色">☀</button>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="navbar-links" id="navLinks">
        <li><a href="index.html">首页</a></li>
        <li><a href="yuedu.html" class="active">阅读室</a></li>

      </ul>
    </div>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <div class="hero-badge" style="display:inline-block;margin-bottom:1rem;">✦ 阅读室</div>
      <h1 class="section-title">
        <span class="chinese-title gold-text">三家经典</span>
      </h1>
      <p class="section-subtitle" style="margin:1rem auto 0;">
        佛 · 道 · 儒<br>修行不限于一家，智慧不囿于一派。
      </p>
    </div>
  </section>

  <!-- Reader View (hidden by default) -->
  <section id="readerView" style="display:none;padding-top:0;">
    <div class="container" style="max-width:800px;">
      <div class="reader-toolbar">
        <button class="btn btn-glass btn-sm" id="btnBack"><span style="margin-right:0.3rem;">←</span> 返回书库</button>
        <div class="reader-nav">
          <button class="btn btn-glass btn-sm" id="btnPrev" disabled>上一章</button>
          <span class="reader-chapter-indicator" id="chapterIndicator"></span>
          <button class="btn btn-glass btn-sm" id="btnNext" disabled>下一章</button>
        </div>
      </div>
      <div class="reader-content" id="readerContent"></div>
    </div>
  </section>

  <!-- Library View -->
  <section id="libraryView" style="padding-top:0;">
    <div class="container" style="max-width:800px;">

      <!-- Tradition Tabs -->
      <div class="glass-strong" style="display:inline-flex;gap:0.25rem;padding:0.3rem;border-radius:100px;margin-bottom:var(--space-lg);" id="traditionTabs">
        <button class="btn btn-sm btn-primary" data-tab="buddhist" style="border-radius:100px;">☸ 佛家</button>
        <button class="btn btn-sm btn-glass" data-tab="daoist" style="border-radius:100px;">☯ 道家</button>
        <button class="btn btn-sm btn-glass" data-tab="confucian" style="border-radius:100px;">📜 儒家</button>
      </div>

      <!-- Text List -->
      <div id="textList"></div>
    </div>
  </section>

  <!-- Reading progress bar -->
  <div class="reading-progress" id="readingProgress"></div>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div>
          <div class="footer-brand"><span class="gold-text">静界</span> · Realm of Stillness</div>
          <div class="footer-text" style="margin-top:0.3rem;">年轻修行人的精神角落</div>
        </div>
        <div class="footer-links">
          <a href="yuedu.html">阅读室</a>
          <a href="riqian.html">日签</a>
          <a href="rumen.html">入门</a>
          <a href="about.html">关于</a>
          <a href="https://github.com/1332505739/jingjie" target="_blank">GitHub</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/yuedu-data.js"></script>
  <script src="js/yuedu.js"></script>
  <script src="js/main.js"></script>
