<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" style="width:100%;max-width:600px;">
  <defs>
    <linearGradient id="renGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e8d5a3" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="duGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d5a3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === FRONT VIEW: 任脉 === -->
  <g transform="translate(30, 20)">

    <!-- Body outline -->
    <ellipse cx="85" cy="30" rx="28" ry="32" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <line x1="85" y1="62" x2="85" y2="130" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <!-- Shoulders -->
    <path d="M57 75 Q40 80 25 60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M113 75 Q130 80 145 60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <!-- Arms -->
    <path d="M25 60 Q18 110 20 170 Q22 200 15 220" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M145 60 Q152 110 150 170 Q148 200 155 220" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <!-- Torso -->
    <path d="M57 75 Q50 120 52 170 Q54 200 60 230 L110 230 Q116 200 118 170 Q120 120 113 75" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <!-- Legs -->
    <path d="M60 230 Q55 280 50 340 Q48 370 40 400" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M110 230 Q115 280 120 340 Q122 370 130 400" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>

    <!-- Ren Mai (任脉) - front midline -->
    <line x1="85" y1="32" x2="85" y2="220" stroke="url(#renGrad)" stroke-width="2" filter="url(#glow)"/>

    <!-- Acupoints on Ren Mai -->
    <circle cx="85" cy="42" r="3.5" fill="#c9a96e" opacity="0.8"/><text x="95" y="46" font-size="10" fill="currentColor" opacity="0.7">承浆</text>
    <circle cx="85" cy="82" r="3.5" fill="#c9a96e" opacity="0.8"/><text x="42" y="86" font-size="10" fill="currentColor" opacity="0.7">膻中</text>
    <circle cx="85" cy="145" r="4.5" fill="#e8d5a3" opacity="0.9" filter="url(#glow)"/><text x="96" y="149" font-size="12" fill="#c9a96e" font-weight="600">气海 · 丹田</text>
    <circle cx="85" cy="175" r="3" fill="#c9a96e" opacity="0.7"/><text x="42" y="179" font-size="10" fill="currentColor" opacity="0.7">关元</text>

    <!-- Palm highlight -->
    <circle cx="20" cy="140" r="4" fill="#c9a96e" opacity="0.6"/><text x="0" y="143" font-size="9" fill="currentColor" opacity="0.6">劳宫</text>
    <circle cx="150" cy="140" r="4" fill="#c9a96e" opacity="0.6"/><text x="156" y="143" font-size="9" fill="currentColor" opacity="0.6">劳宫</text>

    <!-- Label -->
    <text x="85" y="-8" text-anchor="middle" font-size="16" fill="#c9a96e" font-family="Noto Serif SC, serif" font-weight="600">任 脉</text>
    <text x="85" y="260" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">前正中线 · 阴脉之海</text>
  </g>

  <!-- === BACK VIEW: 督脉 === -->
  <g transform="translate(310, 20)">

    <!-- Body outline -->
    <ellipse cx="85" cy="30" rx="28" ry="32" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <line x1="85" y1="62" x2="85" y2="130" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <path d="M57 75 Q40 80 25 60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M113 75 Q130 80 145 60" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M25 60 Q18 110 20 170 Q22 200 15 220" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M145 60 Q152 110 150 170 Q148 200 155 220" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M57 75 Q50 120 52 170 Q54 200 60 230 L110 230 Q116 200 118 170 Q120 120 113 75" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"/>
    <path d="M60 230 Q55 280 50 340 Q48 370 40 400" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>
    <path d="M110 230 Q115 280 120 340 Q122 370 130 400" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2"/>

    <!-- Du Mai (督脉) - back midline -->
    <line x1="85" y1="32" x2="85" y2="220" stroke="url(#duGrad)" stroke-width="2" filter="url(#glow)"/>

    <!-- Acupoints on Du Mai -->
    <circle cx="85" cy="28" r="4.5" fill="#e8d5a3" opacity="0.9" filter="url(#glow)"/><text x="96" y="32" font-size="12" fill="#c9a96e" font-weight="600">百会</text>
    <circle cx="85" cy="50" r="3" fill="#c9a96e" opacity="0.7"/><text x="96" y="54" font-size="10" fill="currentColor" opacity="0.7">风府</text>
    <circle cx="85" cy="80" r="3.5" fill="#c9a96e" opacity="0.8"/><text x="40" y="84" font-size="10" fill="currentColor" opacity="0.7">大椎</text>
    <circle cx="85" cy="130" r="3" fill="#c9a96e" opacity="0.7"/><text x="40" y="134" font-size="10" fill="currentColor" opacity="0.7">至阳</text>
    <circle cx="85" cy="165" r="4.5" fill="#e8d5a3" opacity="0.9" filter="url(#glow)"/><text x="96" y="169" font-size="12" fill="#c9a96e" font-weight="600">命门</text>
    <circle cx="85" cy="195" r="3" fill="#c9a96e" opacity="0.7"/><text x="40" y="199" font-size="10" fill="currentColor" opacity="0.7">腰阳关</text>

    <!-- Feet -->
    <circle cx="48" cy="395" r="3.5" fill="#c9a96e" opacity="0.6"/><text x="28" y="400" font-size="9" fill="currentColor" opacity="0.6">涌泉</text>
    <circle cx="122" cy="395" r="3.5" fill="#c9a96e" opacity="0.6"/><text x="130" y="400" font-size="9" fill="currentColor" opacity="0.6">涌泉</text>

    <!-- Label -->
    <text x="85" y="-8" text-anchor="middle" font-size="16" fill="#c9a96e" font-family="Noto Serif SC, serif" font-weight="600">督 脉</text>
    <text x="85" y="260" text-anchor="middle" font-size="11" fill="currentColor" opacity="0.5">后正中线 · 阳脉之海</text>
  </g>

  <!-- Subtitle -->
  <text x="320" y="480" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.35">任主阴 · 督主阳 · 任督通 · 百脉通</text>
</svg>
